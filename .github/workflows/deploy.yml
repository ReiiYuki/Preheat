name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-web:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web
        run: pnpm build
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ./dist

  build-desktop:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            artifact: desktop-mac
          - platform: ubuntu-22.04
            target: ''
            artifact: desktop-linux
          - platform: windows-latest
            target: ''
            artifact: desktop-windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Tauri
        run: pnpm tauri build ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
      - name: Rename and Prepare Artifacts
        shell: bash
        run: |
          mkdir -p upload-bin
          find src-tauri/target -name "*.dmg" -exec cp {} upload-bin/Preheat-macOS.dmg \; || true
          find src-tauri/target -name "*.exe" -exec cp {} upload-bin/Preheat-Windows.exe \; || true
          find src-tauri/target -name "*.AppImage" -exec cp {} upload-bin/Preheat-Linux.AppImage \; || true
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: upload-bin/*

  deploy-pages:
    needs: [build-web, build-desktop]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Download mac desktop
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac
          path: dist/downloads
      - name: Download windows desktop
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist/downloads
      - name: Download linux desktop
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist/downloads
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
